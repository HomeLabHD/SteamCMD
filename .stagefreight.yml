version: 1

ci:
  image: docker.cr.pcfae.com/prplanit/stagefreight:latest-dev

git:
  branches:
    main: "^main$"
  tags:
    stable:     { pattern: "^v?\\d+\\.\\d+\\.\\d+$" }
    prerelease: { pattern: "^v?\\d+\\.\\d+\\.\\d+-.+" }
  versioning:
    branch_builds:
      default: { base_from: [stable], format: "{base}-dev+{sha}" }
    # No tags yet on this fork — allow dev builds with an explicit sha-stamped base.
    no_lineage: { mode: explicit, version: "0.0.0-dev+{sha}" }

vars:
  org: hlhd
  github_org: HomeLabHD
  gitlab_group: HomeLabHD
  repo: steamcmd
  github_repo: SteamCMD

builds:
  # hlhd/steamcmd — SteamCMD base image (debian-slim + glibc/i386) for game-server images.
  steamcmd:
    kind: docker
    platforms: [linux/amd64]

forges:
  gitlab:
    provider: gitlab
    url: "https://gitlab.prplanit.com"
    credentials: GITLAB
  github:
    provider: github
    url: "https://github.com"
    credentials: GITHUB

repos:
  primary:
    forge: gitlab
    project: "{var:gitlab_group}/{var:repo}"
    roles: [primary]
    branches:
      default: main
    worktree: "."
  github-mirror:
    forge: github
    project: "{var:github_org}/{var:github_repo}"
    roles: [mirror, publish-origin]
    sync:
      git: true
      releases: true

registries:
  dockerhub:
    provider: docker
    url: docker.io
    credentials: DOCKER
    default_path: "{var:org}/{var:repo}"
  harbor:
    provider: harbor
    url: cr.pcfae.com
    credentials: HARBOR
    default_path: "{var:org}/{var:repo}"
  ghcr:
    provider: ghcr
    url: ghcr.io
    credentials: GHCR
    default_path: "homelabhd/{var:repo}"

publish:
  stable:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: steamcmd
    tags: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }
  prerelease:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: steamcmd
    tags: ["v{version}"]
    when: { git_tags: [prerelease], events: [tag] }
  dev:
    kind: registry
    registry: [dockerhub, ghcr, harbor]
    build: steamcmd
    tags: ["dev-{sha:8}", "latest-dev"]
    when: { branches: [main], events: [push] }
    retention:
      keep_last: 6
      protect: ["latest-dev"]
  release:
    kind: release
    type: latest
    repos: [primary]
    aliases: ["v{version}", "latest"]
    when: { git_tags: [stable], events: [tag] }

build_cache:
  mode: hybrid
  external:
    registry: harbor
    path: "cache"
    fallback: "main"
  local:
    retention:
      max_age: "7d"
      max_size: "8GB"

manifest:
  enabled: true
  mode: workspace

commit:
  default_type: docs
  conventional: true
  backend: git

lint:
  level: full
  exclude: ["*.png", "*.svg", "*.ico"]
  modules:
    freshness:
      enabled: true
      cache_ttl: 300
      sources:
        docker_images: true
      vulnerability:
        enabled: true
    tabs: { enabled: true }
    secrets: { enabled: true }
    conflicts: { enabled: true }
    filesize: { enabled: true }
    unicode: { enabled: true, detect_bidi: true, detect_zero_width: true, detect_control_ascii: true }

release:
  enabled: true
  security_summary: true
  registry_links: true

security:
  enabled: true
  output: ".stagefreight/security"
  sbom: true
  release_detail: full

toolchains:
  trivy: "0.69.3"
  syft: "1.42.3"
  grype: "0.110.0"
  osv-scanner: "2.3.5"
  cosign: "3.0.6"
